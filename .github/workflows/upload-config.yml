name: Upload config.php

# Run manually from the Actions tab. config.php is gitignored and excluded from
# the normal deploy, so this is how it reaches the server. It is stored as the
# CONFIG_PHP_B64 secret (base64 of the file).
#
# The admin Credentials screen rewrites config.php on the server, so by default
# an existing copy is left alone; tick "overwrite" only to replace it on purpose.
on:
  # Drop the push trigger once this workflow is on main; Run workflow works then.
  push:
    branches: [ci/deploy-env]
  workflow_dispatch:
    inputs:
      overwrite:
        description: Replace config.php if it already exists on the server
        type: boolean
        default: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
      CONFIG_PHP_B64: ${{ secrets.CONFIG_PHP_B64 }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - name: Upload to includes/config.php
        run: |
          if [ -z "$CONFIG_PHP_B64" ]; then
            echo "::error::Missing repository secret CONFIG_PHP_B64"
            exit 1
          fi

          # The FTP account logs straight into the site folder (see deploy.yml).
          existing=$(curl -sS --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/includes/" || true)
          if echo "$existing" | grep -qx 'config.php' && [ "$OVERWRITE" != "true" ]; then
            echo "includes/config.php already exists on the server; left unchanged."
            echo "Re-run with \"overwrite\" ticked to replace it."
            exit 0
          fi

          echo "$CONFIG_PHP_B64" | base64 -d > config.php
          if ! head -c 5 config.php | grep -q '<?php'; then
            echo "::error::CONFIG_PHP_B64 does not decode to a PHP file"
            exit 1
          fi

          curl -sS --ftp-create-dirs -T config.php --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/includes/config.php"
          rm config.php
          echo "Uploaded includes/config.php"
