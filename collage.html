<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            overflow: hidden;
        }

        body {
            width: 100%;
            background: #5E3A21;
            overflow: hidden
        }

        .canvas {
            position: relative;
            width: 100vw;
            max-width: none;
            height: 3800px;
            margin: 0;
            overflow: hidden
        }

        .dim {
            position: fixed;
            inset: 0;
            background: rgba(6, 4, 2, 0.50);
            z-index: 9998;
            pointer-events: none
        }

        .blur {
            position: fixed;
            inset: 0;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            pointer-events: none;
            z-index: 9999
        }

        .demo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            text-align: center;
            color: #fff;
            font-family: Georgia, serif;
            pointer-events: none
        }

        .demo h1 {
            font-size: 54px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 28px rgba(0, 0, 0, 0.95);
            margin-bottom: 14px
        }

        .demo p {
            font-size: 18px;
            opacity: .88;
            letter-spacing: 1px;
            text-shadow: 0 1px 14px rgba(0, 0, 0, 0.95)
        }
    </style>
</head>

    <script>
        window.onload = function () {
            var canvas = document.querySelector('.canvas');
            var canvasContent = canvas.innerHTML;
            for (var i = 1; i <= 10; i++) {
                var clone = document.createElement('div');
                clone.innerHTML = canvasContent;
                // Shift all elements in the clone down by i * 3800
                var elements = clone.children;
                for (var j = 0; j < elements.length; j++) {
                    var topStr = elements[j].style.top;
                    if (topStr) {
                        var topVal = parseInt(topStr.replace('px', ''));
                        elements[j].style.top = (topVal + (i * 3800)) + 'px';
                    }
                }
                canvas.appendChild(clone);
            }
            canvas.style.height = (3800 * 11) + 'px';
        };
    </script>
