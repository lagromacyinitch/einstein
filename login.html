<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In • Einstein Center</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="login-screen.css">
  <style>
    .otp-toggle-wrap {
      display: flex;
      gap: 0;
      border: 1px solid #d4c4b4;
      border-radius: 8px;
      overflow: hidden;
      margin: 14px 0 4px;
    }

    .otp-toggle-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 600;
      background: #fff;
      border: none;
      cursor: pointer;
      color: #8D6A4E;
      transition: background .2s, color .2s;
      font-family: inherit;
    }

    .otp-toggle-btn.active {
      background: var(--gold, #C9A84C);
      color: #fff;
    }

    #login-phone-row {
      display: none;
    }

    .otp-hint {
      font-size: 11px;
      color: #a08060;
      margin: 4px 0 10px;
      text-align: center;
    }

    .send-otp-btn {
      width: 100%;
      margin: 6px 0 0;
      padding: 10px;
      background: #5c3317;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    .send-otp-btn:hover {
      background: #7a4520;
    }

    #otp-code-row {
      display: none;
    }

    @media (max-width: 600px) {
      body {
        align-items: flex-start;
        padding: 0;
      }

      .ls-shell {
        width: 100% !important;
        min-height: 100dvh;
        border-radius: 0 !important;
        margin: 0 !important;
      }

      .ls-card {
        padding: 20px 16px !important;
      }

      .ls-header {
        padding: 16px !important;
      }

      .ls-input {
        font-size: 16px !important;
      }

      /* prevent iOS zoom */
      .ls-btn-primary,
      .ls-btn-secondary {
        font-size: 15px !important;
        padding: 14px !important;
      }
    }
  </style>
</head>

<body data-auto-login-init="true">
  <div id="login-screen">
    <div class="login-box">
      <div style="position:absolute; top:16px; left:16px;">
        <button type="button" class="login-back-btn" onclick="window.location.href='main.html'"
          title="Back to Home" aria-label="Back to Home" style="display:flex;align-items:center;justify-content:center;cursor:pointer;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </button>
      </div>
      <div class="login-logo">
        <div class="logo-oval"><img src="images/logo2.jpg" alt="Einstein Center logo"></div>
        <h1>EINSTEIN CENTER</h1>
      </div>

      <form id="login-form">
        <label for="login-user">Username / Email</label>
        <input type="text" id="login-user" placeholder="" autocomplete="username">

        <label for="login-pass">Password</label>
        <div class="password-field">
          <input type="password" id="login-pass" placeholder="" autocomplete="current-password">
          <button type="button" id="toggle-password-btn" class="toggle-password-btn" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <div id="login-error" class="login-error" role="alert"></div>

        <button type="submit" id="login-submit-btn" class="login-btn">Sign In</button>
      </form>

      <p class="login-footer-tagline">Einstein Center for Modern Education • Bohol</p>

      <!-- -- OTP verification section -- -->
      <div id="login-otp-section" style="display:none;border-top:1px solid #e0d4c8;margin-top:18px;padding-top:16px">
        <p style="font-size:13px;font-weight:600;color:#5c3317;margin:0 0 10px;text-align:center">Verify your account
        </p>
        <div class="otp-toggle-wrap">
          <button class="otp-toggle-btn active" id="btn-otp-email" onclick="setOtpChannel('email')">✉️ Email
            OTP</button>

        </div>
        <p class="otp-hint" id="otp-channel-hint">A 6-digit code will be sent to your email.</p>

        <button class="send-otp-btn" onclick="sendOtp()">Send Verification Code</button>

        <div id="otp-code-row" style="margin-top:12px">
          <label style="font-size:12px;font-weight:600;color:#5c3317">Enter 6-digit Code</label>
          <input type="text" id="otp-code" class="login-input" placeholder="______" maxlength="6"
            style="letter-spacing:6px;text-align:center;font-size:20px;margin-top:4px">
          <button class="send-otp-btn" style="background:#2e7d32;margin-top:8px" onclick="verifyOtp()">• Verify
            Code</button>
          <p style="font-size:11px;color:#a08060;text-align:center;margin:8px 0 0">
            Didn't receive it? <a href="#" onclick="sendOtp();return false" style="color:#5c3317">Resend</a>
          </p>
        </div>
      </div>

      <div id="login-signup-row" class="login-footer-links">
        New parent? <a href="#" id="login-signup-link">Create an account</a>
        &nbsp;•&nbsp; <a href="#" id="login-forgot-link">Forgot password?</a>
        &nbsp;•&nbsp; <a href="#" id="login-verify-link" onclick="toggleOtpSection();return false">Verify account</a>
        &nbsp;•&nbsp; <a href="admin.html" style="color:#8D6A4E;font-weight:700">Staff Portal</a>
      </div>
    </div>
  </div>

  <script src="login-screen.js"></script>
  <script>
    document.getElementById('login-signup-link').addEventListener('click', function (e) {
      e.preventDefault();
      const ctx = EinsteinLogin.getReturnContext();
      const params = new URLSearchParams({ signup: '1' });
      if (ctx.returnTo) params.set('return', ctx.returnTo);
      if (ctx.program) params.set('program', ctx.program);
      window.location.href = 'main.html?' + params.toString();
    });



    async function verifyOtp() {
      const errEl = document.getElementById('login-error');
      const code = (document.getElementById('otp-code').value || '').trim();
      const email = (document.getElementById('login-user').value || '').trim();
      const phone = (document.getElementById('otp-phone')?.value || '').trim();
      if (!code) { errEl.style.color = '#c0392b'; errEl.textContent = 'Enter the 6-digit code.'; return; }
      errEl.style.color = '#888'; errEl.textContent = 'Verifying•';
      try {
        const payload = { action: 'verify_otp', channel: _otpChannel, otp: code };
        if (_otpChannel === 'email') payload.email = email;
        else payload.phone = phone;
        const r = await fetch(EinsteinLogin.apiUrl('api_otp.php'), {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const d = await r.json();
        errEl.style.color = d.success ? '#2a7a2a' : '#c0392b';
        errEl.textContent = d.success ? '✓ Account verified! You can now sign in.' : d.message;
        if (d.success) {
          document.getElementById('otp-code-row').style.display = 'none';
          setTimeout(() => { document.getElementById('login-otp-section').style.display = 'none'; }, 3000);
        }
      } catch { errEl.style.color = '#c0392b'; errEl.textContent = 'Network error. Try again.'; }
    }

    // --- Forgot password ? inline reset flow -------------------------------------
    document.getElementById('login-forgot-link').addEventListener('click', function (e) {
      e.preventDefault();
      const email = (document.getElementById('login-user').value || '').trim();
      const emailPrompt = email || prompt('Enter your registered email address:');
      if (!emailPrompt) return;
      const errEl = document.getElementById('login-error');
      errEl.textContent = 'Sending reset code•';
      errEl.style.color = '#888';
      fetch(EinsteinLogin.apiUrl('forgot_password.php'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'request_reset', email: emailPrompt }),
        credentials: 'same-origin',
      })
        .then(r => r.json())
        .then(data => {
          if (data.success) {
            errEl.style.color = '#2a7a2a';
            errEl.textContent = data.message;
            const code = prompt('Enter the 6-digit code sent to your email:');
            if (!code) return;
            const newPw = prompt('Enter your new password (min. 8 characters):');
            if (!newPw) return;
            return fetch(EinsteinLogin.apiUrl('forgot_password.php'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'reset_password', email: emailPrompt, otp: code, new_password: newPw }),
              credentials: 'same-origin',
            }).then(r => r.json()).then(d => {
              errEl.style.color = d.success ? '#2a7a2a' : '#c0392b';
              errEl.textContent = d.message;
            });
          } else {
            errEl.style.color = '#c0392b';
            errEl.textContent = data.message;
          }
        })
        .catch(() => { errEl.style.color = '#c0392b'; errEl.textContent = 'Network error. Please try again.'; });
    });
  </script>
<script src="security.js"></script>
<script src="validation.js"></script>
</body>

</html>
