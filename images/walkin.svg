<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- White background -->
  <rect width="400" height="400" fill="white"/>
  
  <!-- QR-like pattern border -->
  <rect x="20" y="20" width="70" height="70" fill="#000" stroke="#000" stroke-width="3"/>
  <rect x="30" y="30" width="50" height="50" fill="white"/>
  <rect x="40" y="40" width="30" height="30" fill="#000"/>
  
  <rect x="310" y="20" width="70" height="70" fill="#000" stroke="#000" stroke-width="3"/>
  <rect x="320" y="30" width="50" height="50" fill="white"/>
  <rect x="330" y="40" width="30" height="30" fill="#000"/>
  
  <rect x="20" y="310" width="70" height="70" fill="#000" stroke="#000" stroke-width="3"/>
  <rect x="30" y="320" width="50" height="50" fill="white"/>
  <rect x="40" y="330" width="30" height="30" fill="#000"/>
  
  <!-- Center content -->
  <circle cx="200" cy="180" r="50" fill="none" stroke="#5E3A21" stroke-width="3"/>
  <text x="200" y="190" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#5E3A21">👣</text>
  
  <!-- Walk-In text -->
  <text x="200" y="260" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#5E3A21">WALK-IN PAYMENT</text>
  
  <!-- Instructions -->
  <text x="200" y="300" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8D6A4E">Pay ₱1,000 at our center:</text>
  <text x="200" y="325" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8D6A4E">2F ARDC Building, CPG North Avenue</text>
  <text x="200" y="345" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8D6A4E">Tagbilaran, Bohol</text>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#8D6A4E">Monday - Saturday, 7 AM - 7 PM</text>
</svg>
